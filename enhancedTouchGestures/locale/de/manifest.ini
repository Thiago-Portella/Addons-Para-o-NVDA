summary = "Erweiterte Berührungsgesten"
description = """Eine Reihe zusätzlicher Touch-Befehle, einschließlich Navigations- und Hilfe-Befehle.
	Benötigt einen Computer mit einem berührungsempfindlichen  Bildschirm mit Windows 8.0 oder höher. NVDA 2012.4 oder höher muss installiert sein."""
changelog = """* Removed add-on changelog from add-on help (readme) file.
* The "default (all elements)" mode in touch browse mode is now called "default" mode to match NVDA 2026.2 messaging.
* If running NVDA 2026.2, NVDA will no longer appear to do nothing or play error tones when performing browse touch mode commands in web browsers while navigator object is located somewhere other than the document content."""
