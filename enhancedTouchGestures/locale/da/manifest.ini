summary = "Udvidede berøringsfunktioner"
description = """Et sæt af yderligere touch-kommandoer, herunder tabbe- og hjælpekommandoer.
	Kræver en computer med touch-understøttelse med Windows 8.0 eller senere og med NVDA 2017.4 eller senere installeret."""
changelog = """* Removed add-on changelog from add-on help (readme) file.
