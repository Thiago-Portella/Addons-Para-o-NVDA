summary = "Resource Monitor"
description = """Удобный монитор ресурсов сообщающий о загрузке процессора, использовании памяти, состоянии заряда батареи, использовании диска и многого другого."""
changelog = """* Требуется NVDA 2025.3.2 или более поздняя версия.
* NVDA будет озвучивать выпуски Windows Server, используя стандартизированное название выпуска вместо названия выпуска для выделенного сервера, например, Windows Server 24H2 вместо Windows Server 2025.
* NVDA больше не будет добавлять "0 минут" к состоянию заряда батареи (пример: 4 часа вместо 4 часа, 0 минут).
* NVDA будет распознавать дополнительные приставки для обозначения больших объёмов памяти и данных, включая роннабайт (1000 в девятой степени) и кветтабайт (1000 в десятой степени)."""
