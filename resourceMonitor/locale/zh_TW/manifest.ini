summary = "資源監視器"
description = """一個方便的資源監視器，能夠讀出 CPU 負載、記憶體使用情況、電池、磁碟使用狀態及更多。"""
changelog = """* 需要 NVDA 2025.3.2 或更新版本。
* NVDA 將會使用標準化版本名稱來讀出 Windows Server 版本，而非專用的伺服器版本名稱；例如使用 Windows Server 24H2 而非 Windows Server 2025。
* NVDA 不再於電池狀態中加入「0 分鐘」(例如：讀為「4 小時」，而非「4 小時 0 分鐘」)。
* NVDA 將可識別更大記憶體與儲存空間容量的額外字首，包括 ronnabyte (1000 的 9 次方) 及 quettabyte (1000 的 10 次方)。"""
