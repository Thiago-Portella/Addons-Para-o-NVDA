name = clipboardHistory
summary = "Historial del portapapeles"
description = """Módulo global que guarda el historial del portapapeles de Windows en una base de datos local, permitiendo la persistencia y la gestión a través de una interfaz invisible con opciones avanzadas, como a través de una interfaz gráfica simplificada.
Permite buscar, visualizar, obtener datos del texto, gestionar favoritos, pegar contenido en el foco,exportar e importar la base de datos."""
author = "Gerardo Kessler <gera.ar@yahoo.com>"
url = https://github.com/gera-ar/clipboardHistory
version = 1.4
docFileName = readme.html
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.1.0
updateChannel = None
