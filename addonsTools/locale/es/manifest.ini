summary = "Herramientas para administrar complementos"
description = """Conjunto de herramientas para gestionar complementos no disponibles en la tienda de complementos de NVDA:
	* Empaquetador de complementos: para crear un archivo de copia de seguridad de complementos o enviar un complemento modificado a alguien que lo pruebe o lo use;
	* Instalador múltiple: permite seleccionar complementos de una carpeta e instalarlos todos a la vez;
	* Realizar/restaurar copias de seguridad: permite realizar copias de seguridad y restaurar algunas preferencias de NVDA, como configuraciones, perfiles y diccionarios;
	* Documentación de complementos: permite abrir el archivo de documentación.
	"""
