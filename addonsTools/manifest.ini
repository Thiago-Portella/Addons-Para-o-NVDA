name = addonsTools
summary = "Tools for managing add-ons"
description = """Set of tools to manage add-ons not available on NVDA add-ons store:
	* Add-on packager: To create a add-on backup file or to send a modified add-on to someone test or use;
	* Multiple installer: Allows to select add-ons from a folder and install all at once;
	* Make/restore Backups: Allow to backup and restore some NVDA preferences, such as configurations, profiles and dictionaries;
	* Add-ons documentation: allow to open the documentation file."""
author = "Rui Fontes <rui.fontes@tiflotecnia.com>, Ângelo Abrantes <ampa4374@gmail.com> and Abel Passos Jr. <abel.passos@gmail.com> based on the work of Héctor J. Benítez Corredera"
url = https://github.com/ruifontes/addonsTools
version = 2026.05.02
changelog = """Set compatibility wit NVDA 2026.x.
	Updated translations for russian and ucranian."""
docFileName = readme.html
minimumNVDAVersion = 2023.2
lastTestedNVDAVersion = 2026.1
updateChannel = None
