/* Code Block with Copy Button Styles for Hotkeys */
.code-wrapper {
    position: relative;
    margin: 15px 0;
}
.hotkey { 
    background: #2d3436; 
    color: #dfe6e9; 
    padding: 15px 70px 15px 15px; 
    border-radius: 6px; 
    font-family: 'Consolas', monospace; 
    display: block; 
    font-size: 1.1em;
    word-break: break-all;
}
.copy-btn {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    background: #636e72;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8em;
    transition: all 0.3s;
}
.copy-btn:hover { background: #2980b9; }
.copy-btn.copied { background: #27ae60; }

.feature-grid { display: block; margin-top: 20px; }
.feature-section { background: #fafbfc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
.feature-item-detail { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #e2e8f0; }
.feature-item-detail:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.feature-title { font-weight: bold; color: #2c3e50; font-size: 1.1em; }
.feature-desc { color: #555; font-size: 0.95em; margin: 4px 0; }

.monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; list-style-type: none; padding-left: 0; margin-top: 20px; }
